<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字符实体</title>
</head>
<body>
    <!-- 空格字符实体 -->
    <div>洛 克王国</div>
    <div>洛&nbsp;&nbsp;&nbsp;&nbsp;克王国</div>
    <div>洛&#160;&#160;&#160;&#160;克王国</div>
    <!-- 小于号<和大于号>字符实体 -->
    <div>我们学习过很多标题标签,其中&lt;h1&gt;是最厉害的一个</div>
    <!-- &字符实体 -->
    <div>我们今天学习了一个可以表示空格的字符实体,它是&amp;nbsp;</div>
    <div>我们今天学习了一个可以表示&的字符实体,它是&amp;amp;</div>
    <!-- 人民币￥字符实体 -->
    <div>当前商品的价格是:&yen;199</div>
    <!-- 版权所有©字符实体 -->
    <div>&copy;版权所有</div>
</body>
</html>
