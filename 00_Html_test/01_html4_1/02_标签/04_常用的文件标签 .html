<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常用的文件标签</title>
</head>
<body>
    <p>
        <!-- 要着重阅读的内容 -->
        <em>前端开发技术</em>
    </p>
    <p>
        <!-- 十分重要的内容（语气比 em 要强）  -->
        <strong>前端开发技术</strong>
    </p>
    <p>
        <!-- 没有语义，用于包裹短语的通用容器 -->
        <span>前端开发技术</span>
    </p>
</body>
</html>
