<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>框架标签</title>
</head>
<body>
    <!-- 利用iframe嵌入一个普通网页 -->
    <iframe src="https://www.taobao.com" width="500" height="500" frameborder="0"></iframe>
    <!-- 利用iframe嵌入图片 -->
    <iframe src="./resourse/blueming.jpg" frameborder="0" width="500" height="500"></iframe>
    <br>
    <!-- 与超链接的target属性配合使用 -->
    <a target="rock" href="https://rocom.qq.com/act/a20260304media/index.html?dchannel=19002151&adtag=media.buy.3.callback.other_pc.29367.19002151&msclkid=b95ef07597991e393d469ab15ef73714">洛克王国世界</a>
    <a target="rock" href="https://17roco.qq.com/">洛克王国页游</a>
    <br>
    <!-- 与表单的target属性配合使用 -->
     <form action="https://so.toutiao.com/search" target="rock">
        <input type="text" name="keyword">
        <input type="submit" value="搜索">
     </form>
     <br>
    <iframe name="rock" frameborder="0" width="900" height="300"></iframe>
</body>
</html>
