<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 配置字符编码 -->
    <meta charset="UTF-8">
    <!-- 针对移动端的一个配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 配置网页的关键字 -->
    <meta name="keywords" content="网上购物"> 
    <!-- 配置网页描述信息 -->
    <meta name="description" content="此购物网站成立于1999年">
    <!-- 自动刷新 -->
    <meta http-equiv="refresh" content="3;url=https://www.baidu.com"> 
    <title>meta元信息</title>
</head>

</body>
</html>
