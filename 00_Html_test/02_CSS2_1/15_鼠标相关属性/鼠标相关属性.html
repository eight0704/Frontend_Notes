<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鼠标相关属性</title>
    <style>
        div{
            width: 400px;
            height: 400px;
            background-image:url(../images/新专照片.jpg) ;
            cursor:wait;
        }
        a{
            cursor: grab;
        }
        button{
            cursor: pointer;
        }
        input{
            cursor: move;
        }
    </style>
</head>
<body>
    <div>
        <a href="#">百度</a>
        <button>点击</button>
        <input type="text">
    </div>
</body>
</html>
