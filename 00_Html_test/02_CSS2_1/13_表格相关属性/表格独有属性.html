<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>边框相关属性</title>
    <style>
        table{
            width: 300px;
            border: 2px green solid;
            /* 控制表格列宽 */
            table-layout:fixed;
            /* 控制单元格间距(生效的前提是,不合并单元格边框) */
            border-spacing: 10px;
            /* 合并相邻的单元格边框 */
            border-collapse: collapse;
            /* 隐藏没有内容的单元格(生效的前提是,不合并单元格边框) */
            empty-cells: hide;
            /* 设置表格标题的位置 */
            caption-side: top;
        }
        th,td{
            border: 2px skyblue solid;
        }
        caption{
            border: 2px red solid;
        }
        .number{
            width:40px ;
            height: 100px;
        }
    </style>
</head>
<body>
    <br>
    <table>
        <caption>人员信息</caption>
        <thead>
            <th class="number">序号</th>
            <th>姓名</th>
            <th>性别</th>
            <th>政治面貌</th>
        </thead>
        <tr>
            <td>1</td>
            <td>张三</td>
            <td>男</td>
            <td>党员</td>
        </tr>
        <tr>
            <td>2</td>
            <td>李四</td>
            <td>男</td>
            <td>团员</td>
        </tr>
        <tr>
            <td>3</td>
            <td>王五</td>
            <td>男</td>
            <td>群众</td>
        </tr>
        <tr>
            <td>4</td>
            <td>刘六</td>
            <td>男</td>
            <td>群众</td>
        </tr>
    </table>
</body>
</html>
