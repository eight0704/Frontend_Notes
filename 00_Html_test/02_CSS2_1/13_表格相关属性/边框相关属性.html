<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>边框相关属性</title>
    <style>
        table{
            /* border-width: 2px;
            border-color: green;
            border-style: solid; */
            border: 2px green solid;
        }
        th,td{
            border: 2px skyblue solid;
        }
        caption{
            border: 2px red solid;
        }
        h2{
            border: 4px red solid;
        }
        span{
            border: 4px purple dashed;
        }
    </style>
</head>
<body>
    <h2>边框相关属性,不仅仅用于表格,其他元素也能用</h2>
    <span>你要加油呀!!!</span>
    <br>
    <table>
        <caption>人员信息</caption>
        <thead>
            <th>序号</th>
            <th>姓名</th>
            <th>性别</th>
            <th>政治面貌</th>
        </thead>
        <tr>
            <td>1</td>
            <td>张三</td>
            <td>男</td>
            <td>党员</td>
        </tr>
        <tr>
            <td>2</td>
            <td>张三</td>
            <td>男</td>
            <td>团员</td>
        </tr>
        <tr>
            <td>3</td>
            <td>张三</td>
            <td>男</td>
            <td>群众</td>
        </tr>
        <tr>
            <td>4</td>
            <td>张三</td>
            <td>男</td>
            <td>群众</td>
        </tr>
    </table>
</body>
</html>
