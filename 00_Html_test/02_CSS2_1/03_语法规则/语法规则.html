<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>语法规范</title>
  <style>
    /* 给所有的h1加样式,h1属于选择器 */
    /* 大括号属于声明块 */
    h1 {
      /* 声明:字体颜色为红色 */
      color: blue;
      font-size: 40px;
    }
    /* 选择器与声明块之间，属性名与属性值之间，均有一个空格，理论上能省略，但最好还是写上。 */
  </style>
</head>
<body>
  <h1>欢迎来到尚硅谷学习</h1>
</body>
</html>
