<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>代码风格</title>
  <style>
    /* 展开风格 */
    h1 {
      color: red;
      font-size: 100px;
    }

    /* 紧凑风格 */
    /* h1{color:red;font-size:100px;} */
  </style>
  <!-- 备注:项目上线时，我们会通过工具将【展开风格】的代码变成【紧凑风格】，这样可以减小文件体积，节约网络流量，同时也能让用户打开网页时速度更快。 -->
</head>
<body>
  <h1>欢迎来到尚硅谷学习</h1>
</body>
</html>
