<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体风格</title>
    <style>
        .style1{
            font-size: 100px;
            font-style: normal;
        }
        .style2{
            font-size: 100px;
            font-style: italic;
        }
        .style3{
            font-size: 100px;
            font-style: oblique;
        }
    </style>
</head>
<body>
    <div class="style1">字体族</div>
    <div class="style2">字体族</div>
    <div class="style3">字体族</div>
    <em>字体族</em>
</body>
</html>
