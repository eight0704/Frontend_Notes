<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体粗细</title>
    <style>
        body{
            font-size: 40px;
        }
        .weight1{
            font-weight: lighter;
        }
        .weight2{
            font-weight: normal;
        }
        .weight3{
            font-weight: bold;
        }
        /* 微软雅黑只设置了3种字体大小,大部分字体也是,所以bolder跟bold一样 */
        .weight4{
            font-weight: bolder;
        }
        /* 100~300等同于lighter  */
        .weight5{
            font-weight: 100;
        }
        /* 400~500等同于normal */
        .weight6{
            font-weight: 400;
        }
        /* 600~1000等同于bold */
        .weight7{
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="weight1">字体粗细1</div>
    <div class="weight2">字体粗细2</div>
    <div class="weight3">字体粗细3</div>
    <div class="weight4">字体粗细4</div>
    <div class="weight5">字体粗细5</div>
    <div class="weight6">字体粗细6</div>
    <div class="weight7">字体粗细7</div>
</body>
</html>
