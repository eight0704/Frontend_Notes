<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体大小</title>
    <style>
        /* body{
            font-style: 16px;
        } */
        .font1{
            font-size: 40px;
        }
        .font2{
            font-size: 30px;
        }
        .font3{
            font-size: 20px;
        }
        .font4{
            font-size: 12px;
        }
        /* 浏览器默认字体大小最小是12px,可以直接调 */
        .font5{
            font-size: 3px;
        }
    </style>
</head>
<body>
    <div class="font1">字体大小</div>
    <div class="font2">字体大小</div>
    <div class="font3">字体大小</div>
    <div class="font4">字体大小</div>
    <div class="font5">字体大小</div>
</body>
</html>
