<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体族</title>
    <style>
        .family1{
            font-size: 100px;
            font-family: "微软雅黑";
        }
        .family2{
            font-size: 100px;
            font-family: "宋体";
        }
        .family3{
            font-size: 100px;
            font-family: "华文彩云";
        }
        .family4{
            font-size: 100px;
            font-family: "华文彩云","华文琥珀","微软雅黑";
        }
        .family5{
            font-size: 100px;
            font-family: "STCaiyun","STHupo","Microsoft YaHei",sans-serif;
        }
    </style>
</head>
<body>
    <div class="family1">字体族</div>
    <div class="family2">字体族</div>
    <div class="family3">字体族</div>
    <div class="family4">字体族</div>
    <div class="family5">字体族</div>
</body>
</html>
