<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素选择器</title>
    <style>
        h1{
            color: chocolate;
            font-size: 80px;
        }
        h2{
            color: aqua;
            font-size: 60px;
        }
        p{
            color: green;
            font-size: 20px;
        }

    </style>
</head>

<body>
    <h1>洛克王国</h1>
    <h2>梦想起点</h2>
    <p>暗夜拾光</p>
    <p>怪诞狂欢</p>
    <p>铅绘童话</p>
    <p>月咏狂想</p>
</body>
</html>
