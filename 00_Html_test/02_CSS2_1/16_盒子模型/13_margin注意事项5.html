<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin注意事项5</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
        }
        .box1{
            background-color: red;
        }
        .box2{
            background-color: green;
            margin-top: -200px;
        }
    </style>
</head>
<body>
    <!-- 注意事项5:margin值可以是负数 -->
    <div class="box box1">1</div>
    <div class="box box2">2</div>
</body>
</html>
