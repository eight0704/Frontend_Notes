<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子外边距</title>
    <style>
        div{
            width: 400px;
            height: 400px;
            background-color: red;

            margin-left: 10px;
            margin-right: 20px;
            margin-top: 30px;
            margin-bottom: 40px;

            /* 四边全是 */
            margin: 50px;
            /* 上下,左右 */
            margin: 10px 20px;
            /* 上,左右,下 */
            margin: 10px 20px 30px;
            /* 上,右,下,左 */
            margin: 10px 20px 30px 40px;

        }
    </style>
</head>
<body>
    <div>
        你好呀
    </div>
</body>
</html>
