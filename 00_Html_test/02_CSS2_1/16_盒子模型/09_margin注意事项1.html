<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin注意事项1</title>
    <style>
        .outer{
            width: 400px;
            height: 400px;
            padding: 50px;
            background-color: black;
        }
        .inner{
            width: 100px;
            height: 100px;
            margin: 100px;
            background-color: blue;
        }
    </style>
</head>
<body>
    <!-- 注意事项1:子元素的margin是参考父元素的content计算的 -->
    <div class="outer">
        <div class="inner">你好呀</div>
    </div>
</body>
</html>
