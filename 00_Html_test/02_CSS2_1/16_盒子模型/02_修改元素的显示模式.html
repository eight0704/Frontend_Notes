<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改元素的显示模式</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            font-size: 20px;
        }
     #d3{
            background-color: blue;
            display: inline-block;
        }
        a{
            width: 200px;
            height: 200px;
            font-size: 2opx;
            display: block;
        }
        #a1{
            background-color: red;
        }
        #a2{
            background-color: green;
        }
        #a3{
            background-color: blue;
        }        #d1{
            background-color: red;
            display: block;
        }
        #d2{
            background-color: green;
            display: inline;
        }
   
    </style>
</head>
<body>
    <div id="d1">你好1</div>
    <div id="d2">你好2</div>
    <div id="d3">你好3</div>
    <a href="#" id="a1">百度1</a>
    <a href="#" id="a2">百度2</a>
    <a href="#" id="a3">百度3</a>
</body>
</html>
