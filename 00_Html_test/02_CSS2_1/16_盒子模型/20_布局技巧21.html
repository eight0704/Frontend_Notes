<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布局技巧2</title>
    <style>
    .outer{
        width: 400px;
        height: 400px;
        background-color: red;
        /* text-align 这个属性只对它所在元素内部的“行内内容”生效 */
        /* 文字水平居中 */
        text-align: center;
        /* 单行文字垂直居中:行高等于块级元素的高 */
        line-height: 400px;
    }
    .inner{
        background-color: blue;
        font-size: 20px;
    }
    </style>
</head>
<body>
    <div class="outer">
        <span class="inner">你同我玩</span>
    </div>
</body>
</html>
