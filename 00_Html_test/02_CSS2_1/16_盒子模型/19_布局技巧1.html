<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布局技巧1</title>
    <style>
    .outer{
        width: 400px;
        height: 400px;
        background-color: red;
        overflow: hidden;
    }
    .inner{
        width: 200px;
        height: 100px;
        background-color: blue;
        /* 块级元素水平居中 */
        margin: 0 auto;
        /* (400-100)/2=150,算出垂直居中需要的margin-top */
        margin-top: 150px;
        /* 文字水平居中 */
        text-align: center;
        /* 单行文字垂直居中:行高等于块级元素的高 */
        line-height: 100px;
    }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">inner</div>
    </div>
</body>
</html>
