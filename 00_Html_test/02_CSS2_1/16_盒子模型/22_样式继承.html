<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>样式继承</title>
    <style>
        body{
            /* 可继承 */
            font-size: 30px;
            font-family: 华文彩云;
            color: red;
            /* 不可继承 */
            border: 5px solid #000;
            padding: 5px;
            margin: 5px;
            background-color: skyblue;
        }
    </style>
</head>
<body>
    <div>前端开发技术</div>
    <div>HTML</div>
    <div>CSS</div>
    <div>javascript</div>
</body>
</html>
