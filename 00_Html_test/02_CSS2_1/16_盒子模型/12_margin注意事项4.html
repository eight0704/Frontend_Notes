<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin注意事项4</title>
    <style>
        div{
            width: 800px;
            height: 100px;
            background-color: red;
            /* margin-left: auto;
            margin-right: auto; */
            margin: 100px auto;
        }
        span{
            background-color: green;
            margin: 100px auto;
        }
    </style>
</head>
<body>
    <!-- 注意事项4:margin值也可以是auto,给一个块级元素左右margin设置auto可以实现该元素在其父元素内水平居中 -->
    <div>你好呀</div>
    <span>好好学习</span>
</body>
</html>
