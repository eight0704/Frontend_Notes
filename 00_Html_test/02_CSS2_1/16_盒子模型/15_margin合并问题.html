<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin合并问题</title>
    <style>
        .box1{
            width: 200px;
            height: 200px;
            background-color: red;
            margin-bottom: 50px;
        }
        .box2{
            width: 200px;
            height: 200px;
            background-color: green;
            margin-top: 50px;
        }
        .box3{
            height: 200px;
            width: 200px;
            background-color: blue;
            display: inline-block;
            margin-right: 50px;
        }
        .box4{
            height: 200px;
            width: 200px;
            background-color: purple;
            display: inline-block;
            margin-left: 50px;
        }

    </style>
</head>
<body>
    <div class="box1">1</div>
    <div class="box2">2</div>
    <hr>
    <div class="box3">3</div><div class="box4">4</div>
</body>
</html>
