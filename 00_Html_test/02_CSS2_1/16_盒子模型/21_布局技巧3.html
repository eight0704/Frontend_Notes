<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布局技巧3</title>
    <style>
        .outer{
            width: 400px;
            height: 400px;
            background-color: skyblue;
            text-align: center;
            line-height: 400px;
            font-size: 0px;
        }
        img{
            vertical-align: middle;
        }
        span{
            font-size: 40px;
            vertical-align: middle;
            background-color: orange;
        }
    </style>
</head>
<body>
    <div class="outer">
        <span>我同你玩</span>
        <img src="../images/IU_50px.jpg">
    </div>
</body>
</html>
