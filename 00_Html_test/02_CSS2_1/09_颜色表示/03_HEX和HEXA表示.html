<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX和HEXA表示</title>
    <style>
        /* 用HEX表示颜色 */
        .color1{
            color:#ff0000;
        }
        .color2{
            color: #00ff00;
        }
        .color3{
            color: #0000ff
        }
        /* 用HEXA表示颜色,最后两位表示透明度 */
        .color4{
            color: #87ceebff;
        }
        .color5{
            color:#ffccddff;
        }
        /* 如果都是重复的,可以缩写 */
        .color6{
            color:#fcdf;
        }
    </style>
</head>
<body>
    <h2 class="color1">HEX表示颜色</h2>
    <h2 class="color2">HEX表示颜色</h2>
    <h2 class="color3">HEX表示颜色</h2>
    <h2 class="color4">HEX表示颜色</h2>
    <h2 class="color5">HEX表示颜色</h2>
    <h2 class="color6">HEX表示颜色</h2>
</body>
</html>
