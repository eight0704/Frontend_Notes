<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动练习</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .leftfix{
            float: left;
        }
        .rightfix{
            float: right;
        }
        .clearfix::after{
            content: "";
            display: block;
            clear: both;
        }
        .container{
            width: 960px;
            margin: 0 auto;
        }
        .logo{
            width: 200px;
            height: 80px;
            background-color: #ccc;
            text-align: center;
            line-height: 80px;
        }
        .banner1{
            width: 540px;
            height: 80px;
            background-color: #ccc;
            margin:0 10px;
            text-align: center;
            line-height: 80px
        }
        .banner2{
            width: 200px;
            height: 80px;
            background-color: #ccc;
            text-align: center;
            line-height: 80px
        }
        .menu{
            width: 960px;
            height: 30px;
            background-color: #ccc;
            margin-top: 10px;
            text-align: center;
            line-height: 30px;
        }
        .content{
            margin-top: 10px;
        }
        .left {
            float: left;
            width: 760px;
        }
        .item1,.item2{
            width: 368px;
            height: 198px; 
            border: 1px solid black;
            text-align: center;
            line-height: 190px;
            margin-right: 10px;
        }
        .item3,.item4,.item5,.item6{
            width: 178px;
            height: 198px;
            border: 1px solid black;
            text-align: center;
            line-height: 190px;
            margin-top: 10px;
            margin-right: 10px;
        }
        .right {
            float: right;
            width: 200px;
        }
        .item7,.item8,.item9{
            width: 198px;
            height: 128px;
            border: 1px solid black;
            text-align: center;
            line-height: 120px;
        }
        .item8{
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .footer{
            height: 60px;
            background-color: #ccc;
            margin-top: 10px;
            text-align: center;
            line-height: 60px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="head clearfix">
            <div class="logo leftfix">logo</div>
            <div class="banner1 leftfix">banner1</div>
            <div class="banner2 leftfix">banner2</div>
        </div>
        <!-- 菜单 -->
        <div class="menu">菜单</div>
        <!-- 内容区 -->
        <div class="content clearfix">
            <!-- 左侧 -->
            <div class="left clearfix">
                <!-- 上 -->
                <div class="top">
                    <div class="item1 leftfix">栏目一</div>
                    <div class="item2 leftfix">栏目二</div>
                </div>
                <!-- 下 -->
                <div class="bottom clearfix">
                    <div class="item3 leftfix">栏目三</div>
                    <div class="item4 leftfix">栏目四</div>
                    <div class="item5 leftfix">栏目五</div>
                    <div class="item6 leftfix">栏目六</div>
                </div>
            </div>
            <!-- 右侧 -->
            <div class="right clearfix">
                <div class="item7 leftfix">栏目七</div>
                <div class="item8 leftfix">栏目八</div>
                <div class="item9 leftfix">栏目九</div>
            </div>
        </div>
        <!-- 页脚 -->
        <div class="footer">页脚</div>
    </div>
</body>
</html>
