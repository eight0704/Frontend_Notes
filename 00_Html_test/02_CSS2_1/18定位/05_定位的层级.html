<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位的层级</title>
    <style>
        .outer{
            width: 500px;
            padding: 50px;
            background-color: skyblue;
            border: 1px solid #000;
            position: relative;
        }
        .box{
            width: 200px;
            height: 200px;
            font-size: 20px;
        }
        .box1{
            background-color: red;
        }
        .box2{
            background-color: green;
            position: relative;
            top: -150px;
            left: 40px;
            z-index: 0;
        }
        .box3{
            background-color: blue;
            position: absolute;
            top:150px;
            left:130px;
            z-index: 0;
        }
        .box4{
            background-color: pink;
            position: fixed;
            top:200px;
            left:180px;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
    </div>
</body>
</html>
