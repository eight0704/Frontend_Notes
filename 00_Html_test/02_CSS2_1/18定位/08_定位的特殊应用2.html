<head>

    <title>定位的特殊应用2</title>
    <style>
        .outer{
            height: 600px;

            /* 方案1 推荐*/
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            /* 方案2 */
            /* position: absolute;
            left: 50%;
            top: 50%;
            margin-left: -100px;
            margin-top: -100px; */
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">内部字体</div>
    </div>
</body>
</html>
