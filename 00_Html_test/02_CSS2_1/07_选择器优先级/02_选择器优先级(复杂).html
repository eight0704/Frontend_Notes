<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择器优先级_详细聊</title>
    <style>
    
    .slogan {
        color: blue !important;
    }
    #atguigu {
      color: orange;
    }
    .container span.slogan {
      color: red;
    }
    div>p>span:nth-child(1) {
      color: green;
    }
    </style>
    </head>
    <body>
      <div class="container">
        <p>
          <span class="slogan" id="atguigu" style="color: blueviolet;">尚硅谷，让天下没有难学的技术！</span>
          <span>欢迎同学们来学习！</span>
        </p>
      </div>
    </body>
    </html>
