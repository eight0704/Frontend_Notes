<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rgb和rgba表示</title>
    <style>
        /* 用rgb表示颜色 */
        .color1{
            color:rgb(255,0,0);
        }
        .color2{
            color: rgb(0,255,0);
        }
        .color3{
            color: rgb(0,0,255);
        }
        .color4{
            color: rgb(138,43,226);
        }
        /* 也可以用百分数表示 */
        .color5{
            color:rgb(100%,0%,0%);
        }
        /* 用rgba表示颜色,最后一个表示透明度 */
        .color6{
            color:rgb(255,0,0,0.5);
        }
    </style>
</head>
<body>
    <h2 class="color1">grb表示颜色</h2>
    <h2 class="color2">grb表示颜色</h2>
    <h2 class="color3">grb表示颜色</h2>
    <h2 class="color4">grb表示颜色</h2>
    <h2 class="color5">grb表示颜色</h2>
    <h2 class="color6">grb表示颜色</h2>
</body>
</html>
