<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>属性选择器</title>
    <style>
        /* 第一种写法:选中具有title属性的元素 */
        [title]{
            color: red;
        }
        /* 第二种写法:选中具有title属性.且属性值为atguigu1的元素 */
        [title="atguigu1"]{
            color: yellow;
        }
        /* 第三种写法:选中具有title属性.且以a字母开头的元素 */
        [title^="a"]{
            color: aquamarine;
        }
        /* 第四种写法:选中具有title属性.且以u字母结尾的元素 */
        [title$="u"]{
            color: blueviolet;
        }
        /* 第五种写法:选中具有title属性.且属性值包含t的元素 */
        [title*="t"]{
            color: green;
        }
    </style>
</head>
<body>
    <div title="atguigu1">尚硅谷1</div>
    <div title="atguigu2">尚硅谷2</div>
    <div title="guigu3">尚硅谷3</div>
    <div title="guigu">尚硅谷4</div>
</body>
</html>
