<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI伪类</title>
    <style>
        /* 选中的是勾选的复选框或者单选框按钮 */
        input:checked{
            width: 100px;
            height: 100px;
        }
        /* 选中的是被禁用的input元素 */
        input:disabled{
            background-color: aquamarine;
        }
        /* 选中的是可用的input元素 */
        input:enabled{
            background-color: red;
        }
    </style>

</head>
<body>
    吸烟<input type="checkbox">
    喝酒<input type="checkbox">
    男<input type="radio" name="gender">
    女<input type="radio" name="gender">
    <input type="text">
    <input type="text" disabled>
</body>
</html>
