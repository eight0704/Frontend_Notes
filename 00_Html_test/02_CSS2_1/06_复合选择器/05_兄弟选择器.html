<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兄弟选择器</title>
    <style>
        /* 选中h2后面的紧邻的兄弟p元素--相邻兄弟选择器 */
        h2+p{
            color: red;
        }
        /* 选中h2后面的所有的兄弟p元素--通用兄弟选择器 */
        h2~p{
            color: aqua;
        }
        li+li{
            color: yellow;
        }
    </style>
</head>
<body>
    <p>测试</p>
    <h2>前端技术开发</h2>
    <p>HTML</p>
    <p>CSS</p>
    <p>javascript</p>
    <ul>
        <li>主页1</li>
        <li>主页2</li>
        <li>秒杀</li>
        <li>订单</li>
        <li>我的</li>
    </ul>
    
</body>
</html>
