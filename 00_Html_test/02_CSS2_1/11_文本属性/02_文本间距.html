<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本间距</title>
    <style>
        body{
            font-size: 40px;
        }
        /* 字母间距 */
        .dream1{
            letter-spacing: 20px;
        }
        /* 单词间距 */
        .dream2{
            word-spacing: 20px;
        }
    </style>
</head>
<body>
    <div>I have a dream,文本间距</div>
    <div class="dream1">I have a dream,文本间距</div>
    <div class="dream2">I have a dream,文本间距</div>
</body>
</html>
