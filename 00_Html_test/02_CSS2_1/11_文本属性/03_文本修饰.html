<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本修饰</title>
    <style>
        body{
            font-size: 40px;
        }
        /* 上划绿色虚线 */
        .decoration1{
            text-decoration:overline dotted red;
        }
        /* 下划蓝色波浪线 */
        .decoration2{
            text-decoration: underline wavy blue;
        }
        /* 删除线 */
        .decoration3{
            text-decoration: line-through;
        }
        /* 没有各种线 */
        .decoration6{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="decoration1">文本修饰1</div>
    <div class="decoration2">文本修饰2</div>
    <div class="decoration3">文本修饰3</div>
    <div class="decoration4">文本修饰4</div>
    <a class="decoration5" href="#">文本修饰5</a>
    <a class="decoration6" href="#">文本修饰6</a>
    <ins>文本修饰6</ins>
    <del>文本修饰7</del>
</body>
</html>
