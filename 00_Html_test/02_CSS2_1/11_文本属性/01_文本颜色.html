<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本颜色</title>
</head>
<body>
    <style>
        body{
            font-size: 40px;
        }
        .color1{
            color: red;
        }
        .color2{
            color: rgb(255,0,0);
        }
        .color3{
            color: rgba(255,0,0,0.5);
        }
        .color4{
            color: #ff0000;
        }
        .color5{
            color: #ff000088;
        }
        .color6{
            color: hsl(0,100%,50%);
        }
        .color7{
            color: hsla(0,100%,50%,0.5 );
        }
    </style>
</body>
    <div class="color1">文本颜色1</div>
    <div class="color2">文本颜色2</div>
    <div class="color3">文本颜色3</div>
    <div class="color4">文本颜色4</div>
    <div class="color5">文本颜色5</div>
    <div class="color6">文本颜色6</div>
    <div class="color7">文本颜色7</div>
</html>
